[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-the-search-bar"
version = "0.1.0"
description = "AI Discovery Intelligence Platform (GEO) — XIME analytics capstone"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "psycopg[binary]>=3.1",
    "supabase",
    "httpx",
    "openai>=1.66",
    "plotly",
    "pandas",
    "rapidfuzz",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "mlflow>=3.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
